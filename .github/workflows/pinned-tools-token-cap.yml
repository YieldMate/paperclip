name: Pinned tools token cap

# YIE-70: every overlays/**/pinned-tools.json must stay under 10k cl100k_base schema tokens.
# Runnable without a PR via workflow_dispatch or push to the feature branch.

on:
  pull_request:
    paths:
      - overlays/**
      - scripts/check-pinned-tools-token-cap.mjs
      - scripts/__tests__/check-pinned-tools-token-cap.test.mjs
      - packages/adapters/hermes/src/server/hot-tool-pinning.ts
      - .github/workflows/pinned-tools-token-cap.yml
  push:
    branches:
      - "cursor/yie-70-hot-mcp-pinning-c24b"
      - "cursor/**-c24b"
    paths:
      - overlays/**
      - scripts/check-pinned-tools-token-cap.mjs
      - scripts/__tests__/check-pinned-tools-token-cap.test.mjs
      - packages/adapters/hermes/src/server/hot-tool-pinning.ts
      - .github/workflows/pinned-tools-token-cap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-tools-token-cap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-tools-token-cap:
    name: pinned-tools-token-cap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout paperclip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Spec (YIE-70 r2): CI must call Hermes `_estimate_tool_tokens` / cl100k_base, not chars/4.
      # Pin a SHA (not a mutable branch). Updated when hermes YIE-70 tip moves.
      - name: Checkout hermes-agent (tokenizer authority)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: YieldMate/hermes-agent
          ref: b8df1c67e4192ad5aa05f1db242f490527597beb
          path: .hermes-agent-ci
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Python + tokenizer deps
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install tiktoken + ruamel.yaml
        # hermes_cli.tools_config → hermes_cli.config → hermes_yaml → ruamel.yaml
        run: pip install "tiktoken==0.12.0" "ruamel.yaml>=0.18,<0.19"

      - name: Check pinned tool schema token caps (cl100k_base)
        env:
          HERMES_AGENT_DIR: ${{ github.workspace }}/.hermes-agent-ci
        run: |
          if [ ! -f "$HERMES_AGENT_DIR/scripts/ci/pinned_tools_token_cap.py" ]; then
            echo "::error::hermes-agent pinned_tools_token_cap.py missing at pinned SHA"
            exit 2
          fi
          python "$HERMES_AGENT_DIR/scripts/ci/pinned_tools_token_cap.py" \
            --require-tiktoken \
            overlays

      - name: Structural checks (tool count + missing schema)
        # Hermes script is the tokenizer authority; Node still enforces count/schema presence.
        run: node scripts/check-pinned-tools-token-cap.mjs --engine node

      - name: Check the checker
        run: node --test scripts/__tests__/check-pinned-tools-token-cap.test.mjs
